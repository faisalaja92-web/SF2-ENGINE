name: Build SF2 ENGINE Android APK

on:
  push:
    branches: [main, master, native-audio-prototype]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          CMAKE_PACKAGE="$("$SDKMANAGER" --list | awk '/cmake;3\.[0-9]/{print $1}' | sort -V | tail -n 1)"
          if [ -z "$CMAKE_PACKAGE" ]; then
            echo "No Android SDK CMake package found in sdkmanager catalog"
            exit 1
          fi
          CMAKE_VERSION="${CMAKE_PACKAGE#cmake;}"
          echo "Using Android CMake $CMAKE_VERSION"
          echo "ANDROID_CMAKE_VERSION=$CMAKE_VERSION" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" "ndk;27.2.12479018" "$CMAKE_PACKAGE" || {
            "$SDKMANAGER" "ndk;27.2.12479018" "$CMAKE_PACKAGE"
          }

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build
        env:
          VITE_CONFIG_NATIVE_IGNORE_WARNING: 'true'

      - name: Generate Android project with Capacitor
        run: |
          npx cap add android
          npx cap sync android

      - name: Integrate native clarinet plugin and CMake
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/java/com/faisalaja92/sf2engine
          cp native-audio/android/NativeClarinetPlugin.java android/app/src/main/java/com/faisalaja92/sf2engine/NativeClarinetPlugin.java

          python3 <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle")
          source = gradle.read_text(encoding="utf-8")
          if "native-audio/CMakeLists.txt" not in source:
              android_block = re.search(r'android\s*\{', source)
              if not android_block:
                  raise SystemExit("android { } block not found in app/build.gradle")
              default_config = re.search(r'defaultConfig\s*\{', source)
              if not default_config:
                  raise SystemExit("defaultConfig block not found in app/build.gradle")
              source = source[:default_config.end()] + """
                  externalNativeBuild {
                      cmake {
                          cppFlags "-std=c++17"
                      }
                  }
          """ + source[default_config.end():]
              source = source[:android_block.end()] + """
              externalNativeBuild {
                  cmake {
                      path file("../../native-audio/CMakeLists.txt")
                      version System.getenv("ANDROID_CMAKE_VERSION")
                  }
              }
          """ + source[android_block.end():]
              gradle.write_text(source, encoding="utf-8")

          candidates = list(Path("android/app/src/main").rglob("MainActivity.java"))
          if not candidates:
              raise SystemExit("MainActivity.java not found")
          main = candidates[0]
          java = main.read_text(encoding="utf-8")
          import_line = "import com.faisalaja92.sf2engine.NativeClarinetPlugin;"
          if import_line not in java:
              package_end = java.find(";")
              java = java[:package_end + 1] + "\n" + import_line + java[package_end + 1:]
          if "registerPlugin(NativeClarinetPlugin.class)" not in java:
              java = java.replace(
                  "public void onCreate(Bundle savedInstanceState) {",
                  "public void onCreate(Bundle savedInstanceState) {\n        registerPlugin(NativeClarinetPlugin.class);"
              )
          main.write_text(java, encoding="utf-8")
          print("Registered NativeClarinetPlugin and configured CMake.")
          PY

      - name: Create gold SOUNDFONT ENGINE launcher icon
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick fonts-dejavu-core
          cat > /tmp/sf2-launcher.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#fff6b0"/>
                <stop offset=".22" stop-color="#ffd84d"/>
                <stop offset=".52" stop-color="#b87508"/>
                <stop offset=".76" stop-color="#ffdf62"/>
                <stop offset="1" stop-color="#8a4b00"/>
              </linearGradient>
              <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
                <feGaussianBlur stdDeviation="5" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <rect width="512" height="512" fill="#050505"/>
            <text x="256" y="242" text-anchor="middle" font-family="DejaVu Sans" font-size="65" font-weight="bold" letter-spacing="-3" fill="url(#gold)" stroke="#6e4100" stroke-width="1.5" paint-order="stroke" filter="url(#glow)">SOUNDFONT</text>
            <text x="256" y="316" text-anchor="middle" font-family="DejaVu Sans" font-size="65" font-weight="bold" letter-spacing="8" fill="url(#gold)" stroke="#6e4100" stroke-width="1.5" paint-order="stroke" filter="url(#glow)">ENGINE</text>
            <path d="M85 357 H427" stroke="#eab83b" stroke-width="3" opacity=".85"/>
          </svg>
          SVG
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density="$1"
            pixels="$2"
            mkdir -p "android/app/src/main/res/mipmap-$density"
            convert -background none /tmp/sf2-launcher.svg -resize "${pixels}x${pixels}" "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-$density/ic_launcher.png" "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
            convert -background none /tmp/sf2-launcher.svg -resize "${pixels}x${pixels}" "android/app/src/main/res/mipmap-$density/ic_launcher_foreground.png"
          done
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'XML'
          <resources>
              <color name="ic_launcher_background">#050505</color>
          </resources>
          XML
          echo "Created legacy and adaptive gold SOUNDFONT ENGINE launcher icons."
          
      - name: Configure landscape and immersive fullscreen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text(encoding="utf-8")
          activity = re.search(r'<activity\b[^>]*>', source)
          if not activity:
              raise SystemExit("Main activity tag not found in AndroidManifest.xml")
          tag = activity.group(0)
          if "android:screenOrientation=" not in tag:
              tag = tag[:-1] + ' android:screenOrientation="sensorLandscape">'
              source = source[:activity.start()] + tag + source[activity.end():]
              manifest.write_text(source, encoding="utf-8")

          candidates = list(Path("android/app/src/main").rglob("MainActivity.java"))
          if not candidates:
              raise SystemExit("Capacitor MainActivity.java not found")
          main = candidates[0]
          java = main.read_text(encoding="utf-8")
          if "SYSTEM_UI_FLAG_IMMERSIVE_STICKY" not in java:
              java = java.replace(
                  "import com.getcapacitor.BridgeActivity;",
                  "import com.getcapacitor.BridgeActivity;\n"
                  "import android.os.Bundle;\n"
                  "import android.view.View;"
              )
              java = java.replace(
                  "public class MainActivity extends BridgeActivity {",
                  """public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  hideSystemBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemBars();
              }

              private void hideSystemBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );
              }
          """
              )
              main.write_text(java, encoding="utf-8")
          print("Configured sensorLandscape and immersive fullscreen.")
          PY

      - name: Register native clarinet plugin
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          main = next(iter(Path("android/app/src/main").rglob("MainActivity.java")), None)
          if main is None:
              raise SystemExit("MainActivity.java not found")
          java = main.read_text(encoding="utf-8")
          import_line = "import com.faisalaja92.sf2engine.NativeClarinetPlugin;"
          if import_line not in java:
              pos = java.find(";")
              java = java[:pos + 1] + "\n" + import_line + java[pos + 1:]
          marker = "public void onCreate(Bundle savedInstanceState) {"
          if marker not in java:
              raise SystemExit("MainActivity onCreate method not found")
          if "registerPlugin(NativeClarinetPlugin.class)" not in java:
              java = java.replace(marker, marker + "\n        registerPlugin(NativeClarinetPlugin.class);")
          main.write_text(java, encoding="utf-8")
          print("Native clarinet plugin registered.")
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SF2-ENGINE-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
