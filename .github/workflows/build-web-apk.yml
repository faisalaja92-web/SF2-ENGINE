name: Build SF2 ENGINE Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build
        env:
          VITE_CONFIG_NATIVE_IGNORE_WARNING: 'true'

      - name: Generate Android project with Capacitor
        run: |
          npx cap add android
          npx cap sync android

      - name: Create gold SOUNDFONT ENGINE launcher icon
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick fonts-dejavu-core
          cat > /tmp/sf2-launcher.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#fff6b0"/>
                <stop offset="0.22" stop-color="#ffd84d"/>
                <stop offset="0.52" stop-color="#b87508"/>
                <stop offset="0.76" stop-color="#ffdf62"/>
                <stop offset="1" stop-color="#8a4b00"/>
              </linearGradient>
              <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
                <feGaussianBlur stdDeviation="5" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <rect width="512" height="512" rx="92" fill="#050505"/>
            <path d="M54 194 H458 M94 332 H418" stroke="#9b650c" stroke-width="2" opacity=".8"/>
            <text x="256" y="246" text-anchor="middle" font-family="DejaVu Sans" font-size="65" font-weight="bold" letter-spacing="-3" fill="url(#gold)" stroke="#6e4100" stroke-width="1.5" paint-order="stroke" filter="url(#glow)">SOUNDFONT</text>
            <text x="256" y="316" text-anchor="middle" font-family="DejaVu Sans" font-size="65" font-weight="bold" letter-spacing="8" fill="url(#gold)" stroke="#6e4100" stroke-width="1.5" paint-order="stroke" filter="url(#glow)">ENGINE</text>
            <path d="M120 357 H392" stroke="#eab83b" stroke-width="3" opacity=".85"/>
          </svg>
          SVG
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density="$1"
            pixels="$2"
            mkdir -p "android/app/src/main/res/mipmap-$density"
            convert -background none /tmp/sf2-launcher.svg -resize "${pixels}x${pixels}" "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-$density/ic_launcher.png" "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          convert -background none /tmp/sf2-launcher.svg -resize 512x512 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          echo "Created gold SOUNDFONT ENGINE launcher icons."
          
      - name: Configure landscape and immersive fullscreen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text(encoding="utf-8")
          activity = re.search(r'<activity\b[^>]*>', source)
          if not activity:
              raise SystemExit("Main activity tag not found in AndroidManifest.xml")
          tag = activity.group(0)
          if "android:screenOrientation=" not in tag:
              tag = tag[:-1] + ' android:screenOrientation="sensorLandscape">'
              source = source[:activity.start()] + tag + source[activity.end():]
              manifest.write_text(source, encoding="utf-8")

          candidates = list(Path("android/app/src/main").rglob("MainActivity.java"))
          if not candidates:
              raise SystemExit("Capacitor MainActivity.java not found")
          main = candidates[0]
          java = main.read_text(encoding="utf-8")
          if "SYSTEM_UI_FLAG_IMMERSIVE_STICKY" not in java:
              java = java.replace(
                  "import com.getcapacitor.BridgeActivity;",
                  "import com.getcapacitor.BridgeActivity;\n"
                  "import android.os.Bundle;\n"
                  "import android.view.View;"
              )
              java = java.replace(
                  "public class MainActivity extends BridgeActivity {",
                  """public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  hideSystemBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemBars();
              }

              private void hideSystemBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );
              }
          """
              )
              main.write_text(java, encoding="utf-8")
          print("Configured sensorLandscape and immersive fullscreen.")
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SF2-ENGINE-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
